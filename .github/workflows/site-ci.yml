name: Nouveau socle Astro — contrôles (site/)

# Contrôles du nouveau socle Astro (refonte). Ne concerne QUE site/ :
# ne déploie rien, ne touche ni à la production GitHub Pages ni aux workflows existants.
#   - formatage (Prettier), types (astro check, TypeScript strict), build statique ;
#   - verify-build : noindex hors production, SEO de base, budgets de poids,
#     discipline des tokens, absence de clé secrète ;
#   - verify-catalog (étape 7) : contenu des pages univers / collections / marques
#     recalculé indépendamment depuis Supabase (lecture publique) et comparé à dist/ ;
#   - verify-products (étape 8) : fiches produit (une par produit publié, aucune pour un
#     brouillon), variantes, prix, fil d'Ariane, canonical, JSON-LD, images, page LAB ;
#   - verify-home (étape 9) : accueil (liens, produits publiés mis en avant, mentions
#     interdites, JSON-LD WebSite + Organization).

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  push:
    branches:
      - 'refonte/**'
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  workflow_dispatch:
    inputs:
      cold:
        description: 'Build à froid : ne pas restaurer le cache des images (mesure du pire cas Netlify)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    runs-on: ubuntu-latest
    # Étape 8B : build À FROID mesuré sous la limite de 15 min de Netlify (AVIF effort 3,
    # préréglages mutualisés : docs/REFONTE_ASTRO.md, « Build et images »). Le cache ci-dessous
    # n'accélère que les builds suivants ; il n'est PAS nécessaire pour tenir ce délai.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      DAR_NUR_ENV: preprod
      # Domaine final pour canonical / JSON-LD (comme netlify.toml) ; la sortie reste noindex.
      SITE_URL: https://dar-nur.fr
      # Valeurs PUBLIQUES par conception (lecture seule sous RLS), identiques à netlify.toml.
      SUPABASE_URL: https://sxlpgcnjerlayitaxxyv.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_3J_jC58tHskgwggDRahQCg_q8xM_xAY
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installation
        run: npm ci

      # Images optimisées d'Astro (node_modules/.astro, effacé par npm ci) : restaurées APRÈS
      # l'installation. Clé unique par exécution + préfixe de restauration : toujours le
      # cache le plus récent, réenregistré enrichi en fin de job. L'empreinte de
      # astro.config.mjs est dans la clé : les réglages d'encodeur (effort AVIF…) ne changent
      # pas les noms de fichiers d'Astro, un ancien cache serait donc réutilisé tel quel.
      # Lancement manuel avec « cold » : aucune restauration, build mesuré comme sur Netlify.
      - name: Cache des images optimisées
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: site/node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('site/astro.config.mjs') }}-${{ github.run_id }}
          restore-keys: |
            astro-assets-${{ runner.os }}-${{ hashFiles('site/astro.config.mjs') }}-

      - name: Formatage
        run: npm run format:check

      - name: Types (astro check)
        run: npm run check

      - name: Tests du panier local (étape 10)
        run: npm run test:cart

      - name: Build statique
        run: npm run build

      - name: Vérifications de sortie (noindex, SEO de base, budgets, tokens)
        run: npm run verify

      - name: Contrôles catalogue (pages ↔ Supabase, liens, brouillons, orphelins, JSON-LD)
        run: npm run verify:catalog

      - name: Contrôles fiches produit (Supabase ↔ HTML, variantes, prix, JSON-LD, LAB)
        run: npm run verify:products

      - name: Contrôles de l'accueil (liens, produits mis en avant, mentions interdites, JSON-LD)
        run: npm run verify:home

      - name: Contrôles du parcours de commande (noindex, formulaire, suivi, aucun faux paiement)
        run: npm run verify:orders

      - name: Contrôles juridiques (CGV, confidentialité, mentions légales, anciennes mentions)
        run: npm run verify:legal
