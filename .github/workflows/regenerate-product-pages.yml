name: Régénère le site (Supabase → HTML statique)

# Workflow UNIQUE de régénération automatique du site statique. Il exécute, dans
# un ordre fixe et en un seul commit, tous les générateurs (scripts/regenerer-site.sh) :
# fiches produit /{slug}/, pages catégories (blocs AUTO), idées cadeaux, collection
# Parfums (hub + pages marque), index de recherche.
#
# Pourquoi un seul workflow (29/10/2026) : regenerate-parfums.yml tournait en
# parallèle de celui-ci dans un autre groupe de concurrence ; les deux réécrivaient
# les fiches et sitemap.xml à partir d'états différents de la base, et le rebase de
# publication a échoué sur un conflit de sitemap.xml (exécution 40858402018).
# regenerate-parfums.yml n'est plus qu'un secours manuel qui lance le même script
# dans le même groupe.
#
# Déclenchement :
#   - repository_dispatch "regenerate-product-pages" ET "regenerate-parfums" :
#     envoyés par les triggers Postgres Supabase (products, categories, brands —
#     voir supabase/sql/webhook_automation.sql et parfums_webhook_trigger.sql),
#     inchangés : les deux types aboutissent ici.
#   - workflow_dispatch : bouton manuel "Run workflow".
#   - push sur main touchant index.html à la racine : index.html est le GABARIT des
#     fiches (scripts/generate-product-pages.mjs le lit tel quel).
#   - schedule : filet de sécurité, aux horaires des deux anciens workflows (8×/jour).
#     Le webhook Supabase → GitHub (PAT dans Vault + net.http_post) échoue en silence
#     quand le jeton expire ; un run planifié sans dérive ne committe rien, avec
#     dérive il committe ET le signale (message et résumé de l'exécution).
#
# Concurrence : un seul groupe « regenerate-site », sans annulation de l'exécution en
# cours. GitHub garde au plus une exécution en attente par groupe (une nouvelle
# demande remplace l'ancienne en attente). Aucune demande n'est perdue : chaque
# exécution régénère TOUT depuis l'état de la base au moment où elle démarre, et
# l'exécution en attente démarre forcément après la dernière demande reçue.
# Le checkout prend le dernier main au démarrage (ref: main), pas le commit de
# l'événement, qui peut être antérieur au commit de l'exécution précédente.
#
# Protection anti-boucle — trois barrières indépendantes :
#   1. Le filtre `paths` ne retient que "index.html" à la racine (motifs ancrés à la
#      racine : jamais "<slug>/index.html"). Les générateurs n'écrivent jamais
#      index.html racine (lecture seule).
#   2. Le commit est marqué [skip ci].
#   3. Un push fait avec GITHUB_TOKEN ne déclenche aucun workflow.
on:
  push:
    branches: [main]
    paths:
      - index.html
  repository_dispatch:
    types: [regenerate-product-pages, regenerate-parfums]
  workflow_dispatch: {}
  schedule:
    - cron: '7 0,6,12,18 * * *'
    - cron: '37 3,9,15,21 * * *'

concurrency:
  group: regenerate-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dernier main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Génère, committe si changement réel et publie ; en cas de push refusé,
      # repart du dernier main et régénère (voir scripts/regenerer-site.sh).
      - name: Régénérer et publier
        env:
          EVENEMENT: ${{ github.event_name }}
          PARFUMS_SUPABASE_URL: ${{ secrets.PARFUMS_SUPABASE_URL }}
          PARFUMS_SUPABASE_KEY: ${{ secrets.PARFUMS_SUPABASE_KEY }}
        run: bash scripts/regenerer-site.sh
