name: Régénère les fiches produit (Supabase → HTML statique)

# Régénère à la fois les fiches produit (/{slug}/) ET les blocs marqués
# <!-- AUTO:CATEGORY_*:START/END --> des pages catégories couvertes par
# scripts/generate-category-pages.mjs (Miels Gourmands pour l'instant) — les
# deux générateurs dépendent exactement des mêmes événements (tout produit,
# tout changement de catégorie), inutile de dupliquer les triggers Postgres
# pour ça.
#
# Déclenchement à la demande UNIQUEMENT — aucune exécution planifiée (cron) :
#   - repository_dispatch "regenerate-product-pages" : envoyé automatiquement
#     par les triggers Postgres Supabase sur `products` (tout produit,
#     n'importe quelle catégorie) et `categories` (le label d'une catégorie
#     apparaît sur chaque fiche produit) — voir supabase/sql/webhook_automation.sql.
#   - workflow_dispatch : bouton manuel "Run workflow" dans l'onglet Actions,
#     de secours si besoin d'une republication immédiate.
#   - push sur main touchant index.html à la racine : index.html est le
#     GABARIT des 237 fiches (scripts/generate-product-pages.mjs le lit tel
#     quel et n'en réécrit que le <head> et #productView). Sans ce trigger,
#     toute modification de index.html désynchronisait silencieusement les
#     237 fiches jusqu'au prochain événement Supabase sans rapport.
#     Restreint à main : la boucle de publication ci-dessous rebase en dur
#     sur origin/main, elle serait incorrecte sur une branche de travail.
#
# Protection anti-boucle — deux barrières indépendantes :
#   1. Le filtre `paths` ne retient que "index.html" à la racine. Les motifs
#      `paths` de GitHub sont ancrés à la racine du dépôt : "index.html" ne
#      matche QUE ce fichier, jamais "<slug>/index.html" ni
#      "<catégorie>/index.html" (il faudrait "**/index.html" pour cela).
#      Or le commit de ce workflow ne peut contenir que : <slug>/index.html,
#      <catégorie>/index.html, sitemap.xml et
#      scripts/.generated-product-slugs.json — ce sont les seules cibles
#      d'écriture des deux générateurs, index.html racine n'y étant ouvert
#      qu'en LECTURE. Son propre commit ne peut donc pas le redéclencher.
#   2. Le commit reste marqué [skip ci] : même si la barrière 1 cédait un
#      jour, GitHub n'ouvrirait aucun run pour ce push.
on:
  push:
    branches: [main]
    paths:
      - index.html
  repository_dispatch:
    types: [regenerate-product-pages]
  workflow_dispatch: {}

concurrency:
  group: regenerate-product-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer les fiches produit depuis Supabase
        run: node scripts/generate-product-pages.mjs

      - name: Générer les pages catégories (blocs marqués) depuis Supabase
        run: node scripts/generate-category-pages.mjs

      # Blocs marqués AUTO:GIFT_* de idees-cadeaux/index.html. Même source
      # d'événements que les deux générateurs ci-dessus (tout changement
      # produit). Si les colonnes gift_* n'existent pas encore en base
      # (migration supabase/sql/gift_ideas_migration.sql non passée), le script
      # journalise une notice et sort en 0 sans toucher au fichier — il ne doit
      # pas faire échouer la régénération des 237 fiches.
      #
      # idees-cadeaux/index.html n'est PAS ajouté au filtre `paths` du
      # déclencheur `push` : ce fichier est une SORTIE de ce workflow, l'y
      # inscrire rendrait son propre commit capable de se redéclencher.
      - name: Générer la page Idées cadeaux (blocs marqués) depuis Supabase
        run: node scripts/generate-gift-page.mjs

      - name: Vérifier si le contenu généré a réellement changé
        id: diff
        run: |
          # git add -A sans restriction de chemin : sans risque ici, le
          # checkout de ce job est toujours neuf (aucun fichier étranger ne
          # peut être présent), contrairement à un poste de travail persistant.
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Contenu identique au précédent — aucun commit créé."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Contenu modifié — commit à venir."
          fi

      - name: Committer et publier uniquement si changement réel
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: régénère les fiches produit depuis Supabase [skip ci]"

          # main peut avancer entre le checkout et ce push (autre commit
          # poussé pendant l'exécution du job) : on rebase sur le dernier
          # main et on retente plusieurs fois avant d'abandonner.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "::warning::Push refusé (main a avancé) — tentative $i/5, rebase sur origin/main et nouvel essai."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done

          echo "::error::Échec du push après 5 tentatives (main avance plus vite que le rebase)."
          exit 1
