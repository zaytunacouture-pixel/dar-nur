name: Régénère le site — secours manuel (ancien « Régénère la page Parfums »)

# Secours MANUEL uniquement (bouton "Run workflow"). Depuis le 29/10/2026, toute la
# régénération automatique — y compris la collection Parfums et le signal Supabase
# "regenerate-parfums" — passe par regenerate-product-pages.yml.
#
# Ce workflow lance exactement le même script (scripts/regenerer-site.sh : fiches,
# catégories, cadeaux, parfums, recherche) dans le MÊME groupe de concurrence
# « regenerate-site » : il ne peut jamais tourner en même temps qu'une régénération
# automatique. Comme chaque exécution régénère tout, peu importe laquelle GitHub
# garde en attente : aucune demande n'est perdue.
#
# Pas de repository_dispatch ni de schedule ici : sinon deux workflows recevraient
# le même signal.
on:
  workflow_dispatch: {}

concurrency:
  group: regenerate-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dernier main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Régénérer et publier
        env:
          EVENEMENT: ${{ github.event_name }}
          PARFUMS_SUPABASE_URL: ${{ secrets.PARFUMS_SUPABASE_URL }}
          PARFUMS_SUPABASE_KEY: ${{ secrets.PARFUMS_SUPABASE_KEY }}
        run: bash scripts/regenerer-site.sh
